name: UI quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare fresh reports
        run: |
          mkdir -p test-results
          rm -f docs/qa/static-results.json docs/qa/browser-results.json
          git rev-parse HEAD > test-results/source-head.txt
          printf '%s\n' "$GITHUB_SHA" > test-results/event-sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build, static checks, unit tests
        run: |
          npm run build 2>&1 | tee test-results/build.log
          npm run check 2>&1 | tee test-results/static.log
          npm test 2>&1 | tee test-results/unit.log
      - name: Browser test dependencies (test-only)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser DOM fixture regression
        run: npm run test:ui 2>&1 | tee test-results/browser.log
      - name: Browser HTTP-origin native storage regression
        run: npm run test:storage 2>&1 | tee test-results/storage-origin.log
      - name: Browser HTTP-origin keyboard focus regression
        run: npm run test:keyboard 2>&1 | tee test-results/keyboard-focus.log
      - name: Browser HTTP-origin import candidate ownership
        run: npm run test:candidates 2>&1 | tee test-results/candidate-ownership.log
      - name: Browser HTTP-origin long confirmation reading
        run: npm run test:reading 2>&1 | tee test-results/confirmation-reading.log
      - name: V4 opt-in samples and presentation invariance
        run: npm run test:design 2>&1 | tee test-results/v4-design.log
      - name: V4 portrait geometry and unchanged logical gestures
        run: npm run test:viewport 2>&1 | tee test-results/viewport.log
      - name: V4 core flow and migrated surface regression
        run: npm run test:core 2>&1 | tee test-results/core-flows.log
      - name: V4 full route and state migration matrix
        if: ${{ !cancelled() }}
        run: npm run test:migration 2>&1 | tee test-results/full-migration.log
      - name: Presentation interruption reading and photo geometry
        if: ${{ !cancelled() }}
        run: npm run test:presentation 2>&1 | tee test-results/presentation-suspend.log
      - name: Isolated presentation preference persistence
        if: ${{ !cancelled() }}
        run: npm run test:prefs 2>&1 | tee test-results/presentation-preferences.log
      - name: Upload actual reports and preview, no deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-and-reports
          path: |
            dist/
            docs/qa/*results.json
            test-results/
          if-no-files-found: error

  d4-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact source and prepare browser
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-head.txt
          npm run build
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: D4 rendered contrast and text-only 200 percent resize
        run: npm run test:a11y 2>&1 | tee test-results/d4-accessibility.log
      - name: Upload independent D4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-accessibility-report
          path: |
            dist/
            test-results/
          if-no-files-found: error
