name: UI / gesture defect
description: Report a reproducible screen, gesture, or state problem
title: '[UI] '
body:
  - type: input
    id: screen
    attributes:
      label: Screen IDs / 界面编号
      placeholder: IMG-02 → IMG-03
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps, start state and actual result / 复现
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior, reversal and cancellation / 预期与取消
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OS, browser, origin / 设备与浏览器
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety
      options:
        - label: No real photos, credentials or private account data attached
          required: true
